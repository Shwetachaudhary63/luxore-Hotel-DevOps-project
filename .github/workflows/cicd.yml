name: Luxora Hotel CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      
    - name:  Repository Information
      run: |
        echo "=========================================="
        echo " Luxora Hotel DevOps Project"
        echo "=========================================="
        echo "Repository: ${{ github.repository }}"
        echo "Branch: ${{ github.ref_name }}"
        echo "Commit: ${{ github.sha }}"
        echo "Triggered by: ${{ github.actor }}"
        echo "Event: ${{ github.event_name }}"
        echo "=========================================="
        
    - name:  Validate Repository Structure
      run: |
        echo " Checking project structure..."
        echo ""
        echo "Root directory contents:"
        ls -lah
        echo ""
        
        # Check main files
        echo "Verifying critical files..."
        
        if [ -f "index.html" ]; then
          echo " index.html - Found"
          echo "   Size: $(wc -c < index.html) bytes"
          echo "   Lines: $(wc -l < index.html) lines"
        else
          echo "index.html - NOT FOUND"
        fi
        
        if [ -f "Dockerfile" ]; then
          echo " Dockerfile - Found"
          echo "   Content preview:"
          head -5 Dockerfile
        else
          echo "  Dockerfile - Not found (optional for validation)"
        fi
        
        if [ -f "README.md" ]; then
          echo "README.md - Found"
        fi
        
        echo ""
        
    - name:  Check DevOps Directories
      run: |
        echo " Checking DevOps tool directories..."
        echo ""
        
        # Check Kubernetes
        if [ -d "kubernetes" ]; then
          echo " kubernetes/ directory found"
          echo "   Contents:"
          ls -lh kubernetes/
          echo ""
        else
          echo "kubernetes/ directory not found"
        fi
        
        # Check Ansible
        if [ -d "ansible" ]; then
          echo " ansible/ directory found"
          echo "   Structure:"
          find ansible -type f | head -10
          echo ""
        else
          echo " ansible/ directory not found"
        fi
        
        # Check Terraform
        if [ -d "terraform-docs" ] || [ -d "terraform" ]; then
          echo "terraform/ directory found"
        else
          echo " terraform/ directory not found"
        fi
        
    - name:  Setup Docker Buildx
      uses: docker/setup-buildx-action@v2
      if: hashFiles('Dockerfile') != ''
      
    - name: Build Docker Image (if Dockerfile exists)
      if: hashFiles('Dockerfile') != ''
      run: |
        echo "=========================================="
        echo " Building Docker Image"
        echo "=========================================="
        
        # Build image
        docker build -t luxora-hotel:latest .
        docker build -t luxora-hotel:${{ github.sha }} .
        
        echo ""
        echo " Docker images built successfully!"
        echo ""
        echo "Images:"
        docker images | grep luxora-hotel
        
    - name: Test Docker Image (if built)
      if: hashFiles('Dockerfile') != ''
      run: |
        echo "=========================================="
        echo " Testing Docker Image"
        echo "=========================================="
        
        # Run container
        docker run -d -p 8080:80 --name test-luxora luxora-hotel:latest
        
        # Wait for container to be ready
        echo "Waiting for container to start..."
        sleep 10
        
        # Check if container is running
        echo ""
        echo "Container status:"
        docker ps | grep test-luxora
        
        # Test HTTP response
        echo ""
        echo "Testing HTTP endpoint..."
        curl -f http://localhost:8080 || echo "HTTP test skipped"
        
        # Cleanup
        echo ""
        echo "Cleaning up test container..."
        docker stop test-luxora
        docker rm test-luxora
        
        echo "Docker image test completed!"
        
    - name:  Project Statistics
      run: |
        echo "=========================================="
        echo " Project Statistics"
        echo "=========================================="
        
        echo "Total files: $(find . -type f | wc -l)"
        echo "Total directories: $(find . -type d | wc -l)"
        
        if [ -f "index.html" ]; then
          echo "Website size: $(wc -c < index.html) bytes"
        fi
        
        echo ""
        echo "File types distribution:"
        find . -type f -name "*.yml" -o -name "*.yaml" | wc -l | xargs echo "YAML files:"
        find . -type f -name "*.md" | wc -l | xargs echo "Markdown files:"
        find . -type f -name "*.html" | wc -l | xargs echo "HTML files:"
        find . -type f -name "*.sh" | wc -l | xargs echo "Shell scripts:"
        
    - name: Validation Summary
      run: |
        echo "=========================================="
        echo " CI/CD PIPELINE COMPLETED SUCCESSFULLY!"
        echo "=========================================="
        echo ""
        echo " Code checkout: SUCCESS"
        echo " Repository structure: VALIDATED"
        echo " DevOps directories: VERIFIED"
        
        if [ -f "Dockerfile" ]; then
          echo "Docker image: BUILT & TESTED"
        fi
        
        echo ""
        echo "=========================================="
        echo " Deployment Status: READY"
        echo "=========================================="
        echo ""
        echo " Build Information:"
        echo "   • Repository: luxore-Hotel-DevOps-project"
        echo "   • Branch: ${{ github.ref_name }}"
        echo "   • Commit: ${{ github.sha }}"
        echo "   • Build Number: ${{ github.run_number }}"
        echo "   • Build ID: ${{ github.run_id }}"
        echo ""
        echo "=========================================="
        echo "All checks passed! Project is ready!"
        echo "=========================================="
